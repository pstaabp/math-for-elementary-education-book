<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.5.3</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Quotient-Remainder Theorem.</span>
</h2>
<div class="para logical">
<div class="para">For any two positive whole numbers <span class="process-math">\(A\)</span> and <span class="process-math">\(k\text{,}\)</span> there are unique whole numbers <span class="process-math">\(q\)</span> (the quotient) and <span class="process-math">\(r\)</span> (the remainder) such that</div>
<div class="displaymath process-math">
\begin{equation*}
A = (k \times q) + r
\end{equation*}
</div>
<div class="para">and <span class="process-math">\(0 \leq r \lt k\text{.}\)</span>
</div>
