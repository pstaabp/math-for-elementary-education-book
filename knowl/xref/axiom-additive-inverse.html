<div class="para logical">
<div class="para">For each integer <span class="process-math">\(a\text{,}\)</span> there exists a unique integer called the <dfn class="terminology">opposite</dfn> of <span class="process-math">\(a\)</span> denoted by <span class="process-math">\(-a\)</span> which satisfies</div>
<div class="displaymath process-math">
\begin{equation*}
a+(-a) = 0
\end{equation*}
</div>
